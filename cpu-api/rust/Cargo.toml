[package]
name = "cpu-api-rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "h1"
path = "h1.rs"

[[bin]]
name = "h2"
path = "h2.rs"

[[bin]]
name = "h3"
path = "h3.rs"

[[bin]]
name = "h4"
path = "h4.rs"

[[bin]]
name = "h5"
path = "h5.rs"

[[bin]]
name = "h6"
path = "h6.rs"

[[bin]]
name = "h7"
path = "h7.rs"

[[bin]]
name = "h8"
path = "h8.rs"

[dependencies]
nix = { version = "0.31.3", features = ["process", "mman", "fs"] }
mmap-sync = "2.0.4"
rkyv = { version = "0.7.40", features = ["validation", "strict"] }
bytecheck = "0.6.8"
